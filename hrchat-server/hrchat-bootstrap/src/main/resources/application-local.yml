spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:hrchat;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    validate-on-migrate: true
    clean-disabled: true
  h2:
    console:
      enabled: true
      path: /h2-console
