[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrchat-ai"
version = "0.1.0"
description = "HR 智能问数系统 AI 运行时（LangGraph + AgentScope + agent-gateway）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<0.120",
    "uvicorn[standard]>=0.30,<0.60",
    "pydantic>=2.7,<3.0",
    "httpx>=0.27,<0.28",
    "python-dotenv>=1.0.1,<1.1.0",
    "langgraph>=1.2,<2.0",
    "agentscope>=2.0,<2.1",
]

[project.optional-dependencies]
retrieval = ["sentence-transformers>=3,<6"]
dev = [
    "pytest>=8.2.2,<8.3.0",
    "pytest-asyncio>=0.23.7,<0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["agent_gateway*", "langgraph_flows*", "agentscope_teams*", "adapters*"]
